name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@ca809f7340adf16261a4b9328136b20f97172685
    with:
      source: illustrations-013
      tooling-ref: ca809f7340adf16261a4b9328136b20f97172685
      check-authentication: ${{ inputs.check-authentication }}

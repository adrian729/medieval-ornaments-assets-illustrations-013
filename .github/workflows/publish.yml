name: Publish approved resources
on:
  workflow_dispatch:
    inputs:
      check-authentication:
        description: Verify npm OIDC without publishing
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: resource-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: adrian729/medieval-ornaments/.github/workflows/publish-resource.yml@588520054b7390b6acae313349dfc1d43ba0beeb
    with:
      source: illustrations-013
      tooling-ref: 588520054b7390b6acae313349dfc1d43ba0beeb
      check-authentication: ${{ inputs.check-authentication }}
